<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Atomic CRM</title>
    </head>
    <body>
        <script>
            // Supabase Auth redirects OAuth consent requests to a plain path, but
            // the app uses hash routing: forward to the consent route, keeping
            // the authorization_id query parameter.
            window.location.replace(
                `./#/oauth/consent${window.location.search}`
            );
        </script>
    </body>
</html>

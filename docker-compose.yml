services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ardley
      POSTGRES_PASSWORD: ardley
      POSTGRES_DB: ardley_crm
    ports:
      - "5433:5432"
    volumes:
      - ardley_crm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardley -d ardley_crm"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  ardley_crm_pg:

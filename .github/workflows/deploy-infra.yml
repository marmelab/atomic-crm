name: Deploy CRM infra (dev)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "server/bff.mjs"
      - "sql/**"
      - "docs/schema-direction.sql"
      - ".github/workflows/deploy-infra.yml"

concurrency:
  group: deploy-crm-infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    env:
      CDK_DEFAULT_ACCOUNT: ${{ secrets.CDK_DEFAULT_ACCOUNT }}
      CDK_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Require CDK_DEFAULT_ACCOUNT
        run: |
          if [ -z "$CDK_DEFAULT_ACCOUNT" ]; then
            echo "CDK_DEFAULT_ACCOUNT secret is not set" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Vendor Lambda pg from root lockfile
        working-directory: .
        run: |
          bash infra/scripts/sync-seed-sql.sh
          bash infra/scripts/vendor-lambda-deps.sh

      - name: Configure AWS credentials
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Synth
        run: npx cdk synth --quiet

      - name: Deploy
        if: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: npx cdk deploy ArdleyCrmDevStack --require-approval never

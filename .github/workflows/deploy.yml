name: 🚀 Deploy
on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    pages: write
    contents: write

jobs:
    deploy-doc:
        name: 🚀 Deploy (doc)
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v7
              with:
                  # Keep the job token out of .git/config, where any install
                  # script or build plugin could read it.
                  persist-credentials: false

            - name: ⚙️ Setup node
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            - name: 📥 Download deps
              run: make doc-install

            - name: 🔨 Build Registry
              run: make registry-build

            - name: 🔨 Build Documentation
              run: make doc-build

            # Configured after the builds on purpose: dependency install and
            # bundling must never run with a token in reach.
            - name: ⚙️ Setup git
              env:
                  ORIGIN_REMOTE: https://git:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
              run: |
                  git remote set-url origin "$ORIGIN_REMOTE"
                  git config --global user.email support+actions@github.com
                  git config --global user.name github-actions-bot

            - name: 📡 Deploy Registry
              run: make registry-deploy

            - name: 📡 Deploy Documentation
              run: make doc-deploy

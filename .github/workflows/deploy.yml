name: 🚀 Deploy
on:
    push:
        branches:
            - main

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    pages: write
    contents: write

jobs:
    deploy-doc:
        name: 🚀 Deploy (doc)
        runs-on: ubuntu-latest
        timeout-minutes: 5

        env:
          PRODUCTION_REMOTE: https://git:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: ⚙️ Setup git
              run: |
                git remote set-url origin https://git:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}
                git config --global user.email support+actions@github.com
                git config --global user.name github-actions-bot

            - name: 📥 Download deps
              run: make doc-install

            - name: 🔨 Build Registry
              run: make registry-build

            - name: 🔨 Build Documentation
              run: make doc-build

            - name: 📡 Deploy Registry
              run: make registry-deploy

            - name: 📡 Deploy Documentation
              run: make doc-deploy

    deploy-demo:
        name: 🚀 Deploy (demo)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        env:
            VITE_IS_DEMO: true
            VITE_INBOUND_EMAIL: ${{ vars.VITE_INBOUND_EMAIL }}
            VITE_ATTACHMENTS_BUCKET: ${{ vars.VITE_ATTACHMENTS_BUCKET || 'attachments' }}
            PRODUCTION_REMOTE: https://git:${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ vars.DEMO_DEPLOY_REPOSITORY }}

        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: ⚙️ Setup git
              run: |
                  echo Deploying to pages to ${{ vars.DEMO_DEPLOY_REPOSITORY }}
                  git remote set-url origin https://git:${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ vars.DEMO_DEPLOY_REPOSITORY }}
                  git remote add production $PRODUCTION_REMOTE
                  git config --global user.email support+actions@github.com
                  git config --global user.name github-actions-bot

            - name: 📥 Download deps
              run: npm ci

            - name: 🔨 Build
              run: npm run build:demo

            - name: 📡 Deploy GitHub pages
              run: npx gh-pages --remote production -d dist -b ${{ vars.DEPLOY_BRANCH || 'gh-pages' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

    deploy-supabase:
        name: 🚀 Deploy (supabase)
        runs-on: ubuntu-latest
        timeout-minutes: 10

        env:
            SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
            VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
            VITE_SB_PUBLISHABLE_KEY: ${{ secrets.SB_PUBLISHABLE_KEY }}
            IS_SUPABASE_CONFIGURED: ${{ secrets.SUPABASE_ACCESS_TOKEN && secrets.SUPABASE_DB_PASSWORD && secrets.SUPABASE_PROJECT_ID && secrets.SUPABASE_URL && secrets.SB_PUBLISHABLE_KEY }}
            VITE_IS_DEMO: ${{ vars.VITE_IS_DEMO }}
            VITE_INBOUND_EMAIL: ${{ vars.VITE_INBOUND_EMAIL }}
            VITE_ATTACHMENTS_BUCKET: ${{ vars.VITE_ATTACHMENTS_BUCKET || 'attachments' }}
            PRODUCTION_REMOTE: https://git:${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ vars.DEPLOY_REPOSITORY }}
            POSTMARK_WEBHOOK_USER: ${{secrets.POSTMARK_WEBHOOK_USER}}
            POSTMARK_WEBHOOK_PASSWORD: ${{secrets.POSTMARK_WEBHOOK_PASSWORD}}
            POSTMARK_WEBHOOK_AUTHORIZED_IPS: ${{secrets.POSTMARK_WEBHOOK_AUTHORIZED_IPS}}
            VITE_GOOGLE_WORKPLACE_DOMAIN: ${{secrets.VITE_GOOGLE_WORKPLACE_DOMAIN}}

        steps:
            - name: 📥 Checkout repo
              uses: actions/checkout@v4

            - name: ⚙️ Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: ⚙️ Setup git
              run: |
                  echo Deploying to pages to ${{ vars.DEPLOY_REPOSITORY }}
                  git remote set-url origin https://git:${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}@github.com/${{ vars.DEPLOY_REPOSITORY }}
                  git remote add production $PRODUCTION_REMOTE
                  git config --global user.email support+actions@github.com
                  git config --global user.name github-actions-bot

            - name: ⚙️ Setup supabase
              uses: supabase/setup-cli@v1

            - name: 📥 Download deps
              run: npm ci

            - name: 🔨 Build
              run: npm run build

            # supabase/cli#50244 (open, confirmed): supabase link always calls
            # GET /v1/projects/{ref}/api-keys?reveal=true, which the platform's
            # own OpenAPI spec gates behind api_gateway_keys_secret_read -- a
            # permission that exists NOWHERE in the scoped-token catalog (not
            # under any preset, including Full access). No scoped PAT can ever
            # satisfy it; only a classic (unscoped) PAT can. We deliberately do
            # not use a classic PAT here, so `link` is replaced below with an
            # explicit identity check plus --project-ref/--db-url on the two
            # commands that actually need to reach the project. Neither of
            # those calls the broken endpoint.
            - if: ${{ env.IS_SUPABASE_CONFIGURED }}
              name: 🔒 Verify production project identity
              run: |
                  set -euo pipefail
                  # GET /v1/projects/{ref} needs only Project Settings: Read
                  # (already granted) and never touches the broken api-keys
                  # reveal endpoint. jq ships preinstalled on ubuntu-latest.
                  response=$(curl -sf \
                    -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                    "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID")
                  actual_ref=$(echo "$response" | jq -r '.ref')
                  actual_name=$(echo "$response" | jq -r '.name')
                  actual_status=$(echo "$response" | jq -r '.status')
                  if [ "$actual_ref" != "$SUPABASE_PROJECT_ID" ]; then
                    echo "::error::Project ref mismatch -- token/API returned '$actual_ref', expected '$SUPABASE_PROJECT_ID'. Refusing to deploy."
                    exit 1
                  fi
                  if [ "$actual_name" != "leif-crm" ]; then
                    echo "::error::Project name mismatch -- expected 'leif-crm', got '$actual_name'. Refusing to deploy."
                    exit 1
                  fi
                  echo "Verified production target: $actual_name ($actual_ref), status=$actual_status"

            # BLOCKED, not guessed: db push needs a project connection with no
            # `link` step. Direct connection (db.$SUPABASE_PROJECT_ID.supabase.co)
            # is confirmed IPv6-only for this project (no A record), and
            # GitHub-hosted ubuntu-latest runners have no outbound IPv6 -- so
            # that path cannot work. The session-pooler connection does work
            # from this runner, but its host has a per-project index that
            # cannot be derived from the project ref or region (Supabase's own
            # docs: "the pooler host... can't be composed from your region").
            # Needs SUPABASE_DB_POOLER_HOST (a non-secret hostname, e.g.
            # aws-0-us-west-1.pooler.supabase.com -- from the Dashboard's
            # Connect dialog, Session pooler tab) as a repo Variable before
            # this can be implemented for real. Failing loudly here instead of
            # attempting a guessed connection string.
            - if: ${{ env.IS_SUPABASE_CONFIGURED }}
              name: 📡 Push supabase migrations
              run: |
                  echo "::error::Migration push is blocked pending SUPABASE_DB_POOLER_HOST. See this step's preceding workflow comment for why (supabase/cli#50244 + confirmed IPv6-only direct connection + IPv4-only GitHub runners)."
                  exit 1

            - if: ${{ env.IS_SUPABASE_CONFIGURED && env.POSTMARK_WEBHOOK_USER && env.POSTMARK_WEBHOOK_PASSWORD && env.POSTMARK_WEBHOOK_AUTHORIZED_IPS }}
              name: 📡 Push supabase postmark webhook user secret
              run: |
                  npx supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" POSTMARK_WEBHOOK_USER=${{ env.POSTMARK_WEBHOOK_USER }}
                  npx supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" POSTMARK_WEBHOOK_PASSWORD=${{ env.POSTMARK_WEBHOOK_PASSWORD }}
                  npx supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" POSTMARK_WEBHOOK_AUTHORIZED_IPS=${{ env.POSTMARK_WEBHOOK_AUTHORIZED_IPS }}
                  npx supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" VITE_INBOUND_EMAIL=${{ env.VITE_INBOUND_EMAIL }}
                  npx supabase secrets set --project-ref "$SUPABASE_PROJECT_ID" VITE_ATTACHMENTS_BUCKET=${{ env.VITE_ATTACHMENTS_BUCKET }}

            - if: ${{ env.IS_SUPABASE_CONFIGURED }}
              name: 📡 Deploy supabase functions
              run: npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

            - if: ${{ !env.SUPABASE_ACCESS_TOKEN }}
              name: Check SUPABASE_ACCESS_TOKEN secret
              run: echo ':warning:SUPABASE_ACCESS_TOKEN secret is missing' >> $GITHUB_STEP_SUMMARY

            - if: ${{ !env.SUPABASE_DB_PASSWORD }}
              name: Check SUPABASE_DB_PASSWORD secret
              run: echo ':warning:SUPABASE_DB_PASSWORD secret is missing' >> $GITHUB_STEP_SUMMARY

            - if: ${{ !env.SUPABASE_PROJECT_ID }}
              name: Check SUPABASE_PROJECT_ID secret
              run: echo ':warning:SUPABASE_PROJECT_ID secret is missing' >> $GITHUB_STEP_SUMMARY

            - if: ${{ !env.VITE_SUPABASE_URL }}
              name: Check SUPABASE_URL secret
              run: echo ':warning:SUPABASE_URL secret is missing' >> $GITHUB_STEP_SUMMARY

            - if: ${{ !env.VITE_SB_PUBLISHABLE_KEY }}
              name: Check SB_PUBLISHABLE_KEY secret
              run: echo ':warning:SB_PUBLISHABLE_KEY secret is missing' >> $GITHUB_STEP_SUMMARY

            - if: ${{ !env.POSTMARK_WEBHOOK_USER }}
              name: Check POSTMARK_WEBHOOK_USER secret
              run: echo ':warning:POSTMARK_WEBHOOK_USER secret is missing' >> $GITHUB_STEP_SUMMARY

            - if: ${{ !env.POSTMARK_WEBHOOK_PASSWORD }}
              name: Check POSTMARK_WEBHOOK_USER secret
              run: echo ':warning:POSTMARK_WEBHOOK_PASSWORD secret is missing' >> $GITHUB_STEP_SUMMARY

            - if: ${{ !env.POSTMARK_WEBHOOK_AUTHORIZED_IPS }}
              name: Check POSTMARK_WEBHOOK_USER secret
              run: echo ':warning:POSTMARK_WEBHOOK_AUTHORIZED_IPS secret is missing' >> $GITHUB_STEP_SUMMARY

            - if: ${{ !env.IS_SUPABASE_CONFIGURED }}
              name: Supabase deployment skipped
              run: echo ':warning:Supabase deployment skipped' >> $GITHUB_STEP_SUMMARY

            - name: 📡 Deploy GitHub pages
              run: npx gh-pages --remote production -d dist -b ${{ vars.DEPLOY_BRANCH || 'gh-pages' }}
              env:
                  GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
